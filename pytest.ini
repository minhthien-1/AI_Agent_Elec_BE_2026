[pytest]
testpaths = tests
# Đăng ký marker để pytest không cảnh báo "unknown mark" và để CI lọc được:
#   pytest -m "not integration"   -> chỉ unit test (CI trên GitHub dùng lệnh này)
#   pytest                        -> chạy tất cả (local, khi Docker + Ollama đang chạy)
markers =
    integration: cần dịch vụ thật (PostgreSQL và/hoặc Ollama); CI không chạy nhóm này
